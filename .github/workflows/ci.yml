name: Offline AI and Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Disconnected inference, Sound Postcard, and Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Fetch and verify pinned open model and local WASM runtime
        run: npm run setup
      - name: Test audio, hunt rules, and Sound Postcard
        run: npm test
      - name: Build the offline web app
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Real AST inference with the browser disconnected
        run: npm run test:e2e
        env:
          CI: 'true'
      - name: Save browser evidence (generated test audio only)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence-${{ github.sha }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Prepare Android SDK and bundled offline assets
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties
          npx cap sync android
      - name: Build Android test APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --console=plain
      - name: Verify APK signature and packaged open model
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify android/app/build/outputs/apk/debug/app-debug.apk
          python3 - <<'PY'
          import hashlib, zipfile
          apk = 'android/app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as bundle:
              model = bundle.read('assets/public/models/Xenova/ast-finetuned-audioset-10-10-0.4593/onnx/model_quantized.onnx')
              assert hashlib.sha256(model).hexdigest() == '807d244b58a30eaa89f0a721fb841619c696857aabe4eac93769bd0b61497f61'
              assert bundle.getinfo('assets/public/wasm/ort-wasm-simd-threaded.wasm').file_size > 0
          print('Pinned AI model and WASM are bundled in the APK.')
          PY
      - name: Save Android CI test APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DirtDJ-Android-CI-test-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Record verified behavior
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'REPORT'
          ## Dirt DJ offline checks passed
          - Unit checks cover audio, hunt rules, reminders, speech, and Sound Postcard export.
          - Chromium loads the real AST checkpoint, disconnects, reloads, captures/imports audio, and exports a completed hunt as WAV.
          - Tests check for external HTTP requests and keep self-confirmed finds distinct from AI matches.
          - Android compiles with the hash-verified model and local WASM inside its APK.
          - Artifacts contain synthetic-test screenshots and a CI debug APK. The CI signing key differs from the developer's local key; this is not a Play Store release or an automatic update.
          REPORT
